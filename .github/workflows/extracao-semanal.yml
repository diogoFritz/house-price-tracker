name: Extração semanal de imóveis

on:
  schedule:
    # 08:00 UTC toda a segunda-feira (~9h em Portugal, ±1h consoante o horário de verão).
    - cron: "0 8 * * 1"
  workflow_dispatch: {}  # permite correr manualmente a partir do separador Actions no GitHub

permissions:
  contents: write  # necessário para o passo de commit/push no fim

jobs:
  extracao:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 tqdm

      - name: Correr extração semanal
        run: python scripts/run_semanal.py

      - name: Atualizar dados agregados do dashboard
        run: python scripts/build_dashboard_data.py

      - name: Guardar log como artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: log-extracao-semanal
          path: logs/*.log

      - name: Commit e push dos dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imovirtual/json/*.json remax/json/*.json century21/json/*.json era/json/*.json supercasa/json/*.json scripts/dashboard_data.json
          git diff --cached --quiet && echo "Sem alterações a commitar." || git commit -m "Extração semanal automática ($(date +%Y-%m-%d))"
          git push
